<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Sprites</title>
<style>
body{font:13px system-ui;margin:16px;background:#e9edf1;color:#222}
.sheet{display:flex;flex-wrap:wrap;gap:10px}
figure{margin:0;background:#fff;padding:6px;border-radius:6px;text-align:center;min-width:104px}
figure.dark{background:#20242a;color:#ddd}
img,canvas{image-rendering:pixelated}
figcaption{font-size:11px;word-break:break-all}
h2{font-size:15px;margin:18px 0 8px}
.grey img{filter:grayscale(1)}
</style></head><body>
<label><input type="checkbox" id="g"> greyscale</label>
<div id="out"></div>
<script type="module">
import * as P from '../js/pixel.js';
const out = document.getElementById('out');
// Every picture is a file in game/art/<kind>/; the build lists them with their
// sizes, and this sheet shows that list.
let art = {};
try { art = (await (await fetch('../../dist/content.json', { cache: 'no-store' })).json()).art || {}; } catch (e) {}
const TITLES = { items: ['Items', 3], containers: ['Containers', 2], routes: ['Routes', 2], decor: ['Decorations', 4], scenery: ['Scenery', 2] };
for (const [kind, [title, scale]] of Object.entries(TITLES)) {
  const files = Object.entries(art).filter(([f]) => f.startsWith(kind + '/'));
  const h = document.createElement('h2'); h.textContent = title + ' (' + files.length + ')'; out.append(h);
  const sheet = document.createElement('div'); sheet.className = 'sheet'; out.append(sheet);
  for (const [file, [w, hgt]] of files) {
    const f = document.createElement('figure');
    const im = document.createElement('img');
    im.src = '../art/' + file; im.width = w * scale; im.height = hgt * scale;
    const cap = document.createElement('figcaption');
    cap.textContent = file.slice(kind.length + 1, -4).replace(/--/g, ':');
    f.append(im, cap);
    sheet.append(f);
  }
}
if (!Object.keys(art).length) out.append('No dist/content.json — run python3 tools/build_data.py first.');
const fb = document.createElement('h2'); fb.textContent = 'Fallback for a missing file'; out.append(fb);
out.append(P.draw(['................', '...kkkkkkkkkk...', '..kTTTTTTTTTTk..', '..ktttttttttTk..', '..knnnnnnnnnnk..', '...kkkkkkkkkk...'], 4));
const h = document.createElement('h2'); h.textContent = 'Type'; out.append(h);
out.append(P.pixelText('Münchner Mülltrennung 2026', { scale: 3, shadow: '#94b0c2' }));
out.append(document.createElement('br'));
out.append(P.pixelText('ÄÖÜ 0123456789 .,:!?-+/%()"·×→€–★ STUFE 5', { scale: 2 }));
document.getElementById('g').onchange = e => document.body.classList.toggle('grey', e.target.checked);
</script></body></html>
