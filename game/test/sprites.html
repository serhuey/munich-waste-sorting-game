<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Sprites</title>
<style>
body{font:13px system-ui;margin:16px;background:#e9edf1;color:#222}
.sheet{display:flex;flex-wrap:wrap;gap:10px}
figure{margin:0;background:#fff;padding:6px;border-radius:6px;text-align:center;min-width:104px}
figure.dark{background:#20242a;color:#ddd}
figure.hand{outline:3px solid #f2bf0f}
img,canvas{image-rendering:pixelated}
figcaption{font-size:11px;word-break:break-all}
h2{font-size:15px;margin:18px 0 8px}
.grey img{filter:grayscale(1)}
</style></head><body>
<label><input type="checkbox" id="g"> greyscale</label>
<div id="out"></div>
<script type="module">
import * as S from '../js/sprites.js';
import * as P from '../js/pixel.js';
const out = document.getElementById('out');
// Files drawn by hand (game/art/<kind>/) replace the drawings in code; the
// sheet shows them in their place, marked, using the list the build wrote.
let art = new Set();
try { art = new Set((await (await fetch('../../dist/content.json', { cache: 'no-store' })).json()).art || []); } catch (e) {}
const KIND = { Items: 'items', Containers: 'containers', Routes: 'routes', Decorations: 'decor', Tree: 'scenery', Skyline: 'scenery' };
function section(title, set, scale) {
  const h = document.createElement('h2'); h.textContent = title + ' (' + Object.keys(set).length + ')'; out.append(h);
  const sheet = document.createElement('div'); sheet.className = 'sheet'; out.append(sheet);
  for (const [id, rows] of Object.entries(set)) {
    const f = document.createElement('figure');
    const c = P.draw(rows, scale);
    const file = KIND[title] + '/' + (id === 'sky' ? 'skyline' : id).replace(/:/g, '--') + '.png';
    if (art.has(file)) {
      const im = document.createElement('img');
      im.src = '../art/' + file; im.width = c.width; im.height = c.height;
      f.append(im); f.classList.add('hand');
    } else f.append(c);
    const cap = document.createElement('figcaption'); cap.textContent = (art.has(file) ? '✎ ' : '') + id; f.append(cap);
    sheet.append(f);
  }
}
section('Items', S.ITEMS, 3);
section('Containers', S.CONTAINERS, 2);
section('Routes', S.ROUTES, 2);
section('Tree', { tree: S.TREE }, 2);
section('Decorations', S.DECOR, 4);
section('Skyline', { sky: S.SKYLINE }, 2);
const h = document.createElement('h2'); h.textContent = 'Type'; out.append(h);
out.append(P.pixelText('Münchner Mülltrennung 2026', { scale: 3, shadow: '#94b0c2' }));
out.append(document.createElement('br'));
out.append(P.pixelText('ÄÖÜ 0123456789 .,:!?-+/%()"·×→€–★ STUFE 5', { scale: 2 }));
document.getElementById('g').onchange = e => document.body.classList.toggle('grey', e.target.checked);
</script></body></html>
