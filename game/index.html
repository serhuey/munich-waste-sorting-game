<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Münchner Mülltrennung</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <div id="fixture" hidden>СТЕНД: данные не сверены, играть можно, верить нельзя</div>
  <div id="clock" hidden></div>
  <header>
    <span>тир <b id="tier">1</b> · осталось <b id="left">0</b> из <b id="total">0</b></span>
    <span>верно <b id="right">0</b></span>
  </header>

  <div id="field"></div>
  <div id="say" class="say"></div>

  <div id="tabs" hidden></div>
  <div id="belt"><div id="track"></div></div>

  <div id="hud">
    <span class="touch-hint">свайп по ленте — контейнер · тап по предмету — рассмотреть или разобрать · тап мимо — бросить</span>
    <span class="key-hint">← → лента · Tab место · цифра место · ↑ рассмотреть · пробел бросить</span>
  </div>

  <div id="panel" hidden>
    <div class="panel-card">
      <h2 id="panel-title"></h2>
      <p id="panel-line"></p>
      <p id="panel-note"></p>
      <button id="panel-btn" type="button"></button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
